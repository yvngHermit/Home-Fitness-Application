
name: Home Fitness CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37"

      # 4. Configure Gradle and caching
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. Make Gradle wrapper executable
      - name: Grant execute permission
        run: chmod +x gradlew

      # 6. Run unit tests
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # 7. Build the debug application
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # 8. Save test reports
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # 9. Save the generated APK
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: home-fitness-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
